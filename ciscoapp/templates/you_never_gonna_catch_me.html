<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catch me if you can</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main-text {
            font-size: 4rem;
            font-weight: 300;
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .university {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .gif-container {
            margin: 2rem 0;
            text-align: center;
        }

        .gif {
            max-width: 300px;
            height: auto;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .main-text { 
                font-size: 2.5rem; 
                letter-spacing: 1px;
            }
            .university { 
                font-size: 0.8rem; 
            }
            .gif {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    {% load static %}

    <div class="main-text">catch me if you can</div>
    <div class="university">made ft santiago de guayaquil university</div>
    <div class="gif-container">
        <img src="{% static 'catch_me.gif' %}"
             alt="catch me if you can" >
    </div>
</body>
</html>

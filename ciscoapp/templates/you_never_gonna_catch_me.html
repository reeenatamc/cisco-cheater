<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Never Gonna Catch Me - Hahahaha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .main-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0px #ff6b6b, 6px 6px 0px #4ecdc4, 9px 9px 0px #45b7d1;
            margin-bottom: 20px;
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            0% { color: #ff6b6b; }
            16% { color: #4ecdc4; }
            32% { color: #45b7d1; }
            48% { color: #96ceb4; }
            64% { color: #feca57; }
            80% { color: #ff9ff3; }
            100% { color: #ff6b6b; }
        }

        .hahaha {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 0px #ff6b6b;
            margin-bottom: 30px;
            animation: wiggle 1s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .university {
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 1px 1px 0px #333;
            margin-top: 20px;
            opacity: 0.8;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .emoji {
            font-size: 4rem;
            animation: spin 2s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .floating-emoji:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .floating-emoji:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
        .floating-emoji:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 2s; }
        .floating-emoji:nth-child(4) { bottom: 20%; right: 25%; animation-delay: 3s; }
        .floating-emoji:nth-child(5) { top: 50%; left: 5%; animation-delay: 4s; }
        .floating-emoji:nth-child(6) { top: 60%; right: 10%; animation-delay: 5s; }

        .secret-message {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            transform: rotate(-5deg);
        }

        @media (max-width: 768px) {
            .main-text { font-size: 2.5rem; }
            .hahaha { font-size: 2rem; }
            .container { padding: 20px; margin: 20px; }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-emoji">🎓</div>
        <div class="floating-emoji">📚</div>
        <div class="floating-emoji">💻</div>
        <div class="floating-emoji">🚀</div>
        <div class="floating-emoji">⚡</div>
        <div class="floating-emoji">🎯</div>
    </div>

    <div class="container">
        <div class="main-text">You Never Gonna Catch Me</div>
        <div class="hahaha">Hahahaha! 😂</div>
        <div class="emoji">🎭</div>
        <div class="university">Made ft. Santiago de Guayaquil University</div>
    </div>

    <div class="secret-message">
        🤫 Shh... This is our secret! 🤫
    </div>

    <script>
        // Efectos de partículas al hacer clic
        document.addEventListener('click', function(e) {
            createParticle(e.clientX, e.clientY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.innerHTML = ['🎉', '✨', '🌟', '💫', '⭐'][Math.floor(Math.random() * 5)];
            particle.style.position = 'fixed';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.fontSize = '2rem';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '1000';
            particle.style.animation = 'particleFloat 1s ease-out forwards';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }

        // CSS para las partículas
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleFloat {
                0% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100px) scale(0.5);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Efecto de teclas aleatorias
        document.addEventListener('keydown', function() {
            const randomEmoji = ['🎓', '📖', '💡', '🔍', '🎯', '🚀', '⚡', '🌟'];
            const randomEmojiElement = randomEmoji[Math.floor(Math.random() * randomEmoji.length)];
            
            const keyEffect = document.createElement('div');
            keyEffect.innerHTML = randomEmojiElement;
            keyEffect.style.position = 'fixed';
            keyEffect.style.left = Math.random() * window.innerWidth + 'px';
            keyEffect.style.top = Math.random() * window.innerHeight + 'px';
            keyEffect.style.fontSize = '1.5rem';
            keyEffect.style.pointerEvents = 'none';
            keyEffect.style.zIndex = '999';
            keyEffect.style.animation = 'keyFloat 2s ease-out forwards';
            
            document.body.appendChild(keyEffect);
            
            setTimeout(() => {
                keyEffect.remove();
            }, 2000);
        });

        // CSS para el efecto de teclas
        const keyStyle = document.createElement('style');
        keyStyle.textContent = `
            @keyframes keyFloat {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-150px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(keyStyle);

        // Mensaje secreto que aparece ocasionalmente
        setInterval(() => {
            const messages = [
                '🤫 Pssst... No me van a pillar!',
                '🎭 Actuando como estudiante modelo...',
                '📚 Estudiando... o no? 😏',
                '🎯 Misión: No ser descubierto',
                '🚀 Modo sigilo activado!'
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            const messageDiv = document.createElement('div');
            messageDiv.textContent = randomMessage;
            messageDiv.style.position = 'fixed';
            messageDiv.style.top = '20px';
            messageDiv.style.left = '50%';
            messageDiv.style.transform = 'translateX(-50%)';
            messageDiv.style.background = 'rgba(0, 0, 0, 0.8)';
            messageDiv.style.color = 'white';
            messageDiv.style.padding = '10px 20px';
            messageDiv.style.borderRadius = '20px';
            messageDiv.style.fontSize = '1rem';
            messageDiv.style.zIndex = '1001';
            messageDiv.style.animation = 'messageSlide 3s ease-out forwards';
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }, 8000);

        // CSS para el mensaje secreto
        const messageStyle = document.createElement('style');
        messageStyle.textContent = `
            @keyframes messageSlide {
                0% {
                    transform: translateX(-50%) translateY(-100px);
                    opacity: 0;
                }
                20%, 80% {
                    transform: translateX(-50%) translateY(0);
                    opacity: 1;
                }
                100% {
                    transform: translateX(-50%) translateY(-100px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(messageStyle);
    </script>
</body>
</html>

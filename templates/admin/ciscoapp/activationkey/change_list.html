{% extends "admin/change_list.html" %}

{% block content_title %}
  {{ block.super }}
  
  <div style="background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-top: 15px; margin-bottom: 20px; display: flex; gap: 20px;">
    <div style="flex: 1; padding: 15px; background: #f0fdf4; border-radius: 8px; border-left: 4px solid #16a34a;">
        <h3 style="margin: 0; color: #16a34a; font-size: 14px; text-transform: uppercase; font-weight: 600;">Ganancias Totales</h3>
        <p style="margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: #15803d;">${{ dashboard_revenue }} USD</p>
    </div>
    
    <div style="flex: 1; padding: 15px; background: #eff6ff; border-radius: 8px; border-left: 4px solid #2563eb;">
        <h3 style="margin: 0; color: #2563eb; font-size: 14px; text-transform: uppercase; font-weight: 600;">Total Vendido</h3>
        <p style="margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: #1d4ed8;">{{ dashboard_total_keys }} Lic.</p>
    </div>
    
    <div style="flex: 1; padding: 15px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #475569;">
        <h3 style="margin: 0; color: #475569; font-size: 14px; text-transform: uppercase; font-weight: 600;">Licencias Activas</h3>
        <p style="margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: #334155;">{{ dashboard_active_keys }}</p>
    </div>
  </div>
{% endblock %}
